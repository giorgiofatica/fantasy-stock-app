escribed below until it ships). The query-error return now writes 'failed' with the error; the no-pending return writes 'success' with message 'processed 0 matchups: no pending matchups'. The writer lives in job-status.ts (hermetic tests in job-status.test.ts), checks the upsert's resolved { error }, and never throws, so a failed status write cannot change the HTTP response. The CHECK constraint allows only running|success|failed|retrying, so 'nothing to do' vs 'scored something' is carried by the message text, which BOTH success paths always write. A comment at the 'running' write states the invariant: every later handler return writes a terminal status first.\n\nPre-fix behaviour (traced 2026-07-27; line numbers as of main @ 2be4638): It writes 'running' to cron_job_status at index.ts:880, but terminal statuses exist at only two places: 'success' at :1490 and 'failed' at :1504. Two returns sit between them and write NEITHER, leaving the row permanently at 'running':\n  - :919 — no pending matchups. Returns HTTP 200, logs 'No pending matchups to process'. This is the common path.\n  - :914 — the matchup query itself failed. Returns HTTP 500, logs 'Error fetching matchups:'.\nDiscriminate the two by status code or by that log line. The returns before :880 (:848 apikey rejected, :861 missing config) write no row at all, which is a different and less confusing state. :1338 and :1352 are returns inside the nested updateUserStandings helper, not handler returns.\n\nNOT A SCORING OUTAGE. Five consecutive Fridays (2026-06-26 through 07-24) sat at 'running'. `unscored` was confirmed 0 across every league — no matchups with team1_gain IS NULL and week_end \u003c now() — so :919 firing weekly is the function correctly reporting there is nothing to score. Re-confirmed 2026-09-24: the only completed leagues in prod are three old test leagues whose seasons are over. The stranded row is the entire finding. Do not read those five rows as five missed scoring runs.\n\nSee CLAUDE.md ITH plan.ts, deliberately: week-START has one write path (insert per holding); week-END has TWO, so 'missing' has two kinds. KIND 1 is an existing Monday row whose week_end_price is still NULL (resolve by UPDATE on id). KIND 2 is a mid-week buy with no row at all (resolve by INSERT carrying entered_mid_week=true and the weighted entry price as week_start_price). Completeness is the CONJUNCTION of both, per participant — checking only kind 1 would call a league complete while a mid-week buy went unrecorded.\n\nThe coverage gate runs BEFORE the Alpaca call, so a complete league costs no quota. Writes are all-or-nothing: one unpriceable symbol aborts the whole league (buildCloseWork returns empty updates AND inserts alongside missingSymbols, so a careless caller cannot write a subset). Inserts upsert on (league_id,user_id,week_number,symbol), so overlapping retries re-converge. anyIncomplete now forces terminal status 'retrying'/'failed' — a partial run can no longer report 'success'.","verified":true,"id":"fn.snapshot-week-end","label":"snapshot-week-end","sublabel":"verify_jwt=false · apikey guard","kind":"edge-function","source":{"path":"supabase/functions/snapshot-week-end/index.ts","line":314}},{"layer":"edge","facts":{"verifyJwt":false,"verifyJwtSource":"supabase/config.toml:33","authGuard":"apikey header, constant-time, fail-closed","localModules":["plan.ts"],"tests":["plan.test.ts"],"envVars":["ALPACA_API_KEY","ALPACA_API_SECRET","SB_SECRET_KEY_CRON","SB_SECRET_KEY_INTERNAL","SUPABASE_URL"],"lines":838},"db":null,"declared":null,"drift":[],"annotation":"Modernised in 2caf9f8: all-or-nothing writes per league-week, with a completeness-based coverage gate that runs BEFORE any Alpaca call and skips on alreadyEndPriced / none_expected / complete, healing only the missing participants when coverage is partial.\n\nREAD THE 'will retry' LOG WITH SUSPICION. The ABORT path at index.ts:466 refuses a partial snapshot and logs '... refusing partial snapshot, will retry'. Until 2026-07-27 that promise was never kept: schedule_snapshot_retry passed a TIMESTAMPTZ to cron.schedule, which has no such overload, so it raised on every call and no retry was ever scheduled. FIXED by 20260727000000 (applied; see pg.schedule_snapshot_retry) — an aborted league now re-attempts via a one-shot retry job. Still verify a retry by the 'retrying' row in cron_job_status and the healed week_snapshots rows, not by this log line.\n\nZERO WRITES IS OFTEN CORRECT. Paths producing no week_snapshots rows: :302 Monday holiday (early return, loop never runs), :324 no active matchup leagues, :357 no matchups for the league-week, :413 already_end_priced, :420 no_holdings, :425 already_complete. The two that indicate a PROBLEM are :466 (abort, unpriced symbols) and :494 (upsert error) — and both set anyIncomplete, which forces status 'retrying' (:516) or 'failed' (:530). So terminal status 'success' at :540 PROVES neither problem path fired. Zero rows plus 'success' means every league hit a benign skip.\n\nOne trap in that list: :302 depends on isMarketOpenToday, which returns open:false on a 401 (CLAUDE.md silent-failure #1). A stale Alpaca key therefore produces 'success' + zero rows + the log line 'Monday is a market holiday, skipping' on a day that is not a holiday.","verified":true,"id":"fn.snapshot-week-start","label":"snapshot-week-start","sublabel":"verify_jwt=false · apikey guard","kind":"edge-function","source":{"path":"supabase/functions/snapshot-week-start/index.ts","line":330}},{"layer":"edge","facts":{"verifyJwt":true,"verifyJwtSource":"supabase/config.toml:232","authGuard":null,"localModules":[],"tests":[],"envVars":["SB_PUBLISHABLE_KEY","SUPABASE_URL"],"lines":46},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"fn.symbol-name","label":"symbol-name","sublabel":"verify_jwt=true","kind":"edge-function","source":{"path":"supabase/functions/symbol-name/index.ts","line":26}},{"layer":"edge","facts":{"verifyJwt":true,"verifyJwt ts":{"hasTests":true},"db":null,"declared":null,"drift":[],"annotation":"The cron_job_status writer, extracted so its failure handling is pinned by hermetic tests. Two contracts: (1) it destructures the upsert's resolved { error } — supabase-js does not throw on a Postgres error, and the previous inline writer discarded the result, so a rejected status write was invisible; (2) it NEVER throws and returns a boolean, so a failed telemetry write cannot turn the handler's 200 into a 500.\n\nBoth success summaries (noPendingMessage / scoredMessage) are always non-empty. That is deliberate: the no-pending and scored paths both write 'success', so if only one wrote a message, error_message's NULL-ness would become a discriminator — the overloaded-NULL shape CLAUDE.md warns about. The text carries the distinction; its presence never does.","verified":true,"id":"mod.process-week-results/job-status","label":"job-status.ts","sublabel":"process-week-results","kind":"edge-module","source":{"path":"supabase/functions/process-week-results/job-status.ts","line":1}},{"layer":"module","facts":{"hasTests":true},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"mod.process-week-results/playoff-progression","label":"playoff-progression.ts","sublabel":"process-week-results","kind":"edge-module","source":{"path":"supabase/functions/process-week-results/playoff-progression.ts","line":1}},{"layer":"module","facts":{"hasTests":true},"db":null,"declared":null,"drift":[],"annotation":"Pure decision functions — no side effects, no Deno APIs; every logging call and DB write stays in index.ts. The evaluation ORDER inside decideBatchScoring is part of the contract: freshness is checked before the week>1 rule, so a stale week>1 batch reports stale_no_snapshots (the actionable operational cause) rather than the generic reason. Swapping them would silently relabel every stale skip.","verified":true,"id":"mod.process-week-results/scoring-eligibility","label":"scoring-eligibi on.timezone. Proven live: calling it returned without error (it previously raised) and wrote a 'retrying' row — THE FIRST that table has ever held. That row is the evidence; before the fix the query for it could only ever return zero rows.\n\nNote the change is BEHAVIOR-ADDING. MAX_RETRIES is 3 in both callers and the initial run counts as attempt 1, so a failing run can now re-invoke its function up to 2 more times. For snapshot-week-start that is safe and useful — the coverage gate skips complete leagues and heals only missing participants. For snapshot-week-end it was safe but INEFFECTIVE until 2026-07-28: its old existence-only alreadyProcessed guard skipped a league as soon as ANY row carried a week_end_price. The per-participant coverage gate in close.ts replaced that guard, so week-end retries now heal partial writes too (see fn.snapshot-week-end).","verified":true,"id":"pg.schedule_snapshot_retry","label":"schedule_snapshot_retry(p_job_name text, p_attempt integer)","sublabel":"SECURITY DEFINER · service_role","kind":"pg-function","source":{"path":"supabase/migrations/20261108000001_schedule_snapshot_retry_timeout.sql","line":21}},{"layer":"db","facts":{},"db":{"securityDefiner":true,"searchPath":"public, pg_temp","grants":[{"role":"postgres","privileges":["EXECUTE"]},{"role":"service_role","privileges":["EXECUTE"]}],"grantsRaw":["postgres=X/postgres","service_role=X/postgres"],"anonCallable":false,"authenticatedCallable":false,"owner":"postgres","volatility":"volatile"},"declared":{"definedIn":["supabase/migrations/20261125000005_scrub_deleted_manager.sql:87"],"latestDefinition":"supabase/migrations/20261125000005_scrub_deleted_manager.sql","redefinitions":1},"drift":[],"annotation":null,"verified":true,"id":"pg.scrub_deleted_manager","label":"scrub_deleted_manager(p_user_id uuid)","sublabel":"SECURITY DEFINER · service_role","kind":"pg-function","source":{"path":"supabase/migrations/20261125000005_scrub_deleted_manager.sql","line":87}},{"layer":"db","facts ed Authorization; deliberately NOT the secret key), so their reads no longer depend on the anon policy. (2) 20261114000000 — drops the PUBLIC \"read symbols\" policy, adds symbols_select_authenticated (SELECT TO authenticated USING (true)), REVOKEs ALL from anon and PUBLIC (the table grant, so anon is refused with 42501 rather than filtered to 0 rows), and trims authenticated to SELECT (TRUNCATE is not governed by RLS). Every other reader is service_role or a signed-in client; supabase/tests/symbols_readers.test.ts pins that as a complete set and proves no pre-sign-in screen reaches a symbols read.\n\nTHE HIGH DRIFT ROW (public-role-policies-ungated) reads prod via db-snapshot.json, so it stays until (2) is pushed AND the snapshot is re-captured. After that the remaining authenticated USING (true) policy is intended: reference data, identical for every signed-in player. If the row is still HIGH after a fresh capture, the push did not take — run the migration header's relacl / pg_policies checks.\n\nSUPERSEDED (kept for history): DECIDED 2026-07-28 — KEEP the public SELECT policy. This is settled; do not re-derive it.\n\nThe policy is REQUIRED, not merely tolerated. That distinction is the whole point of this note, because the two readings produce the same migration today and opposite futures. symbol-name/index.ts:35 and symbols-search/index.ts:78 both construct their client with SB_PUBLISHABLE_KEY and do NOT forward the caller's Authorization header, so their queries execute as the anon role. The `USING (true)` policy is what makes symbol lookup and search return rows at all. Tighten it to `TO authenticated` — the change that looks obviously safe by analogy with every other table hardened in B1 — and both functions silently return empty: no error, no 401, just a search box that finds nothing.\n\nWHY IT GRADES HIGH ANYWAY: the map's heuristic flags any policy whose predicate contains no identity check. That is the rule working as designed, not a finding. The data is public NASDAQ/NYSE reference listings refreshed from a public feed, the policy is SELECT-only, and writes go through an RLS-bypassing upsert in refresh-symbols using the secret key. There is nothing user-specific in the table to leak.\n\nIF YOU EVER DO WANT IT LOCKED: the prerequisite is switching symbol-name and symbols-search to SB_SECRET_KEY_INTERNAL first, at which point the anon policy becomes genuinely unnecessary and can be dropped. Doing it in the other order breaks search. Judged not worth the moving parts for public ticker data.","verified":true,"id":"tbl.symbols","label":"symbols","sublabel":"RLS · 1 policy","kind":"table","source":{"path":"supabase/migrations/20260810000001_symbols_add_enrichment_columns.sql","line":32}},{"layer":"db","facts":{},"db":{"rlsEnabled":true,"rlsForced":false,"policies":[]},"declared":{"touchedBy":["supabase/migrations/20261125000006_take_over_team.sql"],"rlsEnabled":true},"drift":[{"field":"policies","declared":"n/a","live":"RLS on, ZERO policies","severity":"low","note":"RLS with no policies denies all access except to roles that bypass RLS (service_role, table owner). This is the correct shape for a service-role-only table — confirm that is the intent."}],"annotation":null,"verified":true,"id":"tbl.takeover_guess_limits","label":"takeover_guess_limits","sublabel":"RLS · 0 policies","kind":"table","source":{"path":"supabase/migrations/20261125000006_take_over_team.sql","line":289}},{"layer":"db","facts":{},"db":{"rlsEnabled":true,"rlsForced":false,"policies":[{"name":"Users can view trades in their leagues","roles":["PUBLIC"],"using":"(EXISTS ( SELECT 1\n   FROM league_members\n  WHERE ((league_members.league_id = trades.league_id) AND (league_members.user_id = (auth.uid())::text))))","command":"SELECT","withCheck":null,"permissive":true}]},"declared":{"touchedBy":["supabase/migrations/20250118000000_create_trades.sql","supabase/migrations/20251210000000_add_alpaca_order_id_to_trades.sql","supabase/migrations/20260810000000_widen_draft_trade_quantity_numeric.sql","supabase/migrations/20261006000000_trades_funded_by_trade_id.sql","supabase/migrations/20261103000000_trades_slot_id.sql","supabase/migrations/20261125000000_trades_user_fk_drop.sql"],"rlsEnabled":true},"drift":[{"field":"policy_roles","groupKey":"public-role-policies-gated","declared":"n/a","live":"1 of 1 policies target PUBLIC; those 1 are gated on caller identity","severity":"low","note":"These PUBLIC-role policies (PUBLIC includes anon) each reference auth.uid()/auth.jwt()/auth.role()/is_member/is_commissioner, so anon matches no rows through them. Cosmetic inconsistency with the newer `TO authenticated` style — worth normalising. This row says nothing about any non-PUBLIC policy on the same table; those are graded separately."}],"annotation":null,"verified":true,"id":"tbl.trades","label":"trades","sublabel":"RLS · 1 policy","kind":"table","source":{"path":"supabase/migrations/20250118000000_create_trades.sql","line":2}},{"layer":"db","facts":{},"db":{"rlsEnabled":true,"rlsForced":false,"policies":[{"name":"Users can insert own profile","roles":["PUBLIC"],"using":null,"command":"INSERT","withCheck":"(auth.uid() = id)","permissive":true},{"name":"Users can update own profile","roles":["PUBLIC"],"using":"(auth.uid() = id)","command":"UPDATE","withCheck":"(auth.uid() = id)","permissive":true},{"name":"user_profiles_select_self","roles":["authenticated"],"using":"(id = auth.uid())","command":"SELECT","withCheck":null,"permissive":true}]},"declared":{"touchedBy":["supabase/migrations/20251210100000_create_user_profiles.sql","supabase/migrations/20251230230000_add_avatar_to_profiles.sql","supabase/migrations/20260122000000_add_push_tokens.sql","supabase/migrations/20261007000000_username_write_path.sql","supabase/migrations/20261017000000_f8_push_tokens_relocation.sql"],"rlsEnabled":true},"drift":[{"field":"policy_roles","groupKey":"public-role-policies-gated","declared":"n/a","live":"2 of 3 policies target PUBLIC; those 2 are gated on caller identity","severity":"low","note":"These PUBLIC-role policies (PUBLIC includes anon) each reference auth.uid()/auth.jwt()/auth.role()/is_member/is_commissioner, so anon matches no rows through them. Cosmetic inconsistency with the newer `TO authenticated` style — worth normalising. This row says nothing about any non-PUBLIC policy on the same table; those are graded separately."}],"annotation":"AUDIT #8, 2026-10-08 — Giorgio's ruling A: a player sees ONLY the name and avatar of users they share a league with (\"we cannot allow a user to see any information outside of the name/avatar of another member in their league (email, etc) or any info about users not in their league\"). This SUPERSEDES the 2026-07-28 'authenticated may read all profiles' decision below.\n\nHOW, in two stages: (1) 20261118000000 adds get_visible_profiles(text[]) -> (id, username, avatar), SECURITY DEFINER, for the caller and anyone who EVER participated in a league the caller is currently in (leavers stay named). Every client read of another player's row moved to it (web UserProfilesContext, mobile draft.tsx, LeagueCarousel); web's Realtime subscription is filtered to the caller's own row. supabase/tests/profile_visibility_callsites.test.ts fails any new direct read of someone else's row. (2) deferred/20261118000001 flips SELECT to id = auth.uid() and revokes anon's grant -- HELD until the live 1.1.0 build (which reads other players' rows directly in eight places, and cannot be reached by OTA from main) is retired; preconditions in deferred/README.md.\n\nUNTIL STAGE 2 IS APPLIED the USING (true) policy below is still live: the HIGH-ish exposure (every account can page every profile) is closed by the flip, not by stage 1. Definer RPCs that name participants (participant_display_name and its callers) read this table as owner and are unaffected by the flip.\n\nSUPERSEDED (history): GATED to authenticated 2026-07-28 (migration 20260728000001). Decision made; do not re-derive.\n\nWAS: \"Anyone can view profiles\" FOR SELECT USING (true) with no TO clause, so PUBLIC — confirmed live via pg_policy (polroles '{-}'). anon could read every username, avatar, expo_push_token and notifications_enabled row. NOW: \"Authenticated users can view profiles\", TO authenticated, USING (true). The insert/update policies (auth.uid() = id) were correct and are untouched.\n\nRESOLVED TOGETHER WITH get_real_user_ids, as it had to be: 20260724000000 revoked anon EXECUTE on that function, whose whole output is which UUIDs are real users — an answer anon could equally obtain by selecting this table. The pair is now consistent UPWARD (both closed) rather than downward.\n\nWHY THE MECHANISM IS SUFFICIENT, and why the function lesson does NOT transfer: functions have exactly ONE gate (EXECUTE), which is why REVOKE ... FROM PUBLIC leaving Supabase's default per-role grants intact was a real hole there (see CLAUDE.md). Tables have TWO layers: the default table-level SELECT grant, and RLS policy role-scoping. With RLS enabled, anon keeps its table grant but matches NO policy, so it gets an empty row set — not an error. Same shape as the B1 league tables, whose anon-read test returned [] in prod.\n\nCONSUMER TRACE (why gating broke nothing): preview-league reads profiles via the service_role admin client, so the join-by-code preview is RLS-immune; web APP_PAUSED renders only LandingPage with every other route \u003cProtected>; both signup paths UPSERT after a session exists; all other reads sit in authenticated mobile screens.\n\nHOW THE MAP GRADES THIS NOW (2026-07-30): the SELECT policy appears as a MEDIUM drift row, groupKey authenticated-role-policies-ungated, reading \"ANY-AUTHENTICATED READ of every row\". It was briefly graded LOW and described as \"not an exposure\" — the heuristic computed its ungated-predicate check only over PUBLIC-role policies, so moving the SELECT to `authenticated` in 20260728000001 took it out of scope and the all-gated branch then asserted a table-wide claim from the PUBLIC subset alone. Fixing the anon half must not silence the rest; the generator now grades on the PREDICATE first and the role second.\n\nSTILL OPEN (L2, escalated by security-reviewer 2026-07-28): expo_push_token remains readable by EVERY authenticated user, not just its owner. That is not merely a metadata leak — apps/mobile/lib/notifications.ts posts to Expo's public push API using the raw token alone, so any authenticated user who reads this table can push arbitrary notifications to any other user. Remediation: split expo_push_token / notifications_enabled into an owner-scoped table (auth.uid() = id) and leave username / avatar on the broadly-readable surface. Merging the gate did NOT close this.","verified":true,"id":"tbl.user_profiles","label":"user_profiles","sublabel":"RLS · 3 policies","kind":"table","source":{"path":"supabase/migrations/20251210100000_create_user_profiles.sql","line":2}},{"layer":"db","facts":{},"db":{"rlsEnabled":true,"rlsForced":false,"policies":[{"name":"week_snapshots_select_members","roles":["authenticated"],"using":"is_member(league_id)","command":"SELECT","withCheck":null,"permissive":true}]},"declared":{"touchedBy":["supabase/migrations/20260105000000_add_week_snapshots.sql","supabase/migrations/20260116000000_matchup_scoring_redesign.sql","supabase/migrations/20260712000006_rls_b1_06_week_snapshots.sql","supabase/migrations/20260727100000_week_snapshots_entered_mid_week.sql"],"rlsEnabled":true},"drift":[],"annotation":"One row per (league, user, week, symbol) — the unique constraint is what makes the snapshot writes idempotent and safe against overlapping retries.\n\nweek_start_price is NOT NULL and always has been. Until 2026-07-27 snapshot-week-end tried to insert NULL into it for mid-week purchases, so that insert failed on every run since 2026-01-15 and those positions were silently dropped from scoring — not merely missing a row, but scored wrong, since calculateUserScore drops a mid-week buy with no end price from BOTH totalGain and totalStartValue.\n\nentered_mid_week is now the discriminator. week_start_price on such a row is the purchase entry price, NOT a Monday open. Both scorers key on the flag, never on the price being null — keying on the price would treat the row as a week-start holding and double-count it, because the same buy is already carried in midWeekTrades. The three UI surfaces that multiply quantity * week_start_price for cost basis need no flag: they compute (currentPrice - entryPrice) * quantity, which is correct for both row kinds.","verified":true,"id":"tbl.week_snapshots","label":"week_snapshots","sublabel":"RLS · 1 policy","kind":"table","source":{"path":"supabase/migrations/20260105000000_add_week_snapshots.sql","line":7}},{"layer":"client","facts":{},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"ui.account.accountApi","label":"accountApi.ts","sublabel":"mobile/lib/account/accountApi.ts","kind":"client-screen","source":{"path":"apps/mobile/lib/account/accountApi.ts","line":1}},{"layer":"client","facts":{},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"ui.account.deletedLabelStore","label":"deletedLabelStore.ts","sublabel":"mobile/lib/account/deletedLabelStore.ts","kind":"client-screen","source":{"path":"apps/mobile/lib/account/deletedLabelStore.ts","line":1}},{"layer":"client","facts":{},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"ui.account.deleteLeaguesApi","label":"deleteLeaguesApi.ts","sublabel":"mobile/lib/account/deleteLeaguesApi.ts","kind":"client-screen","source":{"path":"apps/mobile/lib/account/deleteLeaguesApi.ts","line":1}},{"layer":"client","facts":{},"db":null,"declared":null,"drift":[],"annotation":null,"verified":true,"id":"ui.categoryData","label":"categoryData.ts","sublabel":"mobile/lib/categoryData.ts","kind":"client-screen","source":{"path":"apps/mobile/lib/categoryData.ts","line":1}},{"layer":"client","facts":{},"db":nu bug; the sort is load-bearing for week advancement.","files":["supabase/functions/process-week-results/index.ts:577","supabase/functions/process-week-results/grouping.ts:49"]},{"n":5,"edge":"e.fn.process-week-results->tbl.week_snapshots","detail":"Per batch. Presence of any row sets hasSnapshots; any week_end_price sets hasWeekEndPrices.","files":["supabase/functions/process-week-results/index.ts:598"]},{"n":6,"edge":"e.fn.process-week-results->mod.process-week-results/scoring-eligibility","detail":"GUARDS 1 & 2 — decideBatchScoring. A snapshot-less batch is skipped whole: stale_no_snapshots (>72h) or no_snapshots_week_gt_1. Freshness is checked first, and that order is load-bearing for ops labelling.","files":["supabase/functions/process-week-results/index.ts:763","supabase/functions/process-week-results/scoring-eligibility.ts:218"]},{"n":7,"edge":"e.fn.process-week-results->tbl.trades","detail":"Mid-week trades inside [weekStart, weekEnd], then a second read bounded to week_end so a post-week sale cannot empty holdings and flip a win to an auto-loss.","files":["supabase/functions/process-week-results/index.ts:658"]},{"n":8,"edge":"e.fn.process-week-results->tbl.drafts","detail":"Fallback scorer input — only reachable at week 1.","files":["supabase/functions/process-week-results/index.ts:684"]},{"n":9,"edge":"e.fn.process-week-results->ext.alpaca-data","detail":"Latest quotes, IEX feed. Failures are swallowed into an empty price map rather than throwing.","files":["supabase/functions/process-week-results/index.ts:113"]},{"n":10,"edge":"e.fn.process-week-results->mod.process-week-results/scoring-eligibility","detail":"GUARD 3a — decideUserScorer picks full | legacy | fallback | unscoreable per user. A snapshot-less user past week 1 is unscoreable: cumulative-from-entry is all-time P/L, not a weekly delta.","files":["supabase/functions/process-week-results/index.ts:719","supabase/functions/process-week-results/scoring-eligibility.ts:321"]},{"n":11,"edge":"e.fn.process-week-results->mod.process-week-results/scoring-eligibility","detail":"GUARD 3b — decideMatchupScoring refuses any matchup containing an unscoreable participant. Byes gate on team1 only. Refused matchups keep team1_gain NULL and stay pending.","files":["supabase/functions/process-week-results/index.ts:936","supabase/functions/process-week-results/scoring-eligibility.ts:371"]},{"n":12,"edge":"e.fn.process-week-results->tbl.matchups#update","detail":"Winner written: regular-season bye = no result, empty portfolio = auto-loss, else dollar gain, tiebreak percent then playoff seed. A playoff winner then fills its next-round slot BY ADDRESS (playoff_round_number, bracket_position), conditional on the slot being empty.","files":["supabase/functions/process-week-results/index.ts:1046"]},{"n":13,"edge":"e.fn.process-week-results->tbl.league_standings#update","detail":"Read-then-increment, not transactional and NOT reversible. This irreversibility is the entire reason guards 1-3 refuse rather than fabricate.","files":["supabase/functions/process-week-results/index.ts:1108"]},{"n":14,"edge":"e.fn.process-week-results->tbl.leagues#update","detail":"current_week re-read per batch and advanced only when the batch IS the current week — so a guard-skipped week blocks advancement instead of being stepped over.","files":["supabase/functions/process-week-results/index.ts:1202"]},{"n":15,"edge":"e.fn.process-week-results->pg.complete_league_season","detail":"Season end: champion and runner-up from the scored playoff final (round W of W). Every matchup league has playoffs (playoff_teams 2..managers, required since 20261012000000), so there is no standings-only completion path.","files":["supabase/functions/process-week-results/season-completion.ts:134"]}],"annotation":"The most defensive path in the codebase, and the reason it is defensive is that league_standings increments are irreversible. There is no transaction around the read-then-increment and no compensating write, so a fabricated score cannot be undone by re-running. Three guards therefore refuse rather than guess. Read them in order: decideBatchScoring kills a whole snapshot-less league-week; decideUserScorer marks an individual snapshot-less user unscoreable past week 1; decideMatchupScoring refuses any matchup containing one. All three exist because the fallback scorer returns cumulative-from-draft-entry P/L, which is only a valid weekly delta in week 1.","unverified":["step 15: anchor not found — supabase/functions/process-week-results/index.ts no longer contains \"rpc('complete_league_season'\""]},{"id":"flow.week-start-snapshot","title":"Week-start snapshot","trigger":{"kind":"cron","detail":"pg_cron `snapshot-week-start` — Mon+Tue 14:35 UTC","cronJob":"snapshot-week-start"},"nodePath":["cron.snapshot-week-start","fn.snapshot-week-start","mod.snapshot-week-start/plan","ext.alpaca-data","tbl.week_snapshots","pg.schedule_snapshot_retry"],"steps":[{"n":1,"edge":"e.cron.snapshot-week-start->fn.snapshot-week-start","detail":"net.http_post with apikey from vault `cron_apikey`.","files":["supabase/migrations/20261108000000_cron_explicit_timeouts.sql:114"]},{"n":2,"edge":"e.fn.snapshot-week-start->mod.snapshot-week-start/plan","detail":"Pure planning module — decides which league-weeks need snapshotting and what to fetch.","files":["supabase/functions/snapshot-week-start/plan.ts:95"]},{"n":3,"edge":"e.fn.snapshot-week-start->ext.alpaca-data","detail":"Historical bars for week-start prices.","files":["supabase/functions/snapshot-week-start/index.ts:58"]},{"n":4,"edge":"e.fn.snapshot-week-start->tbl.week_snapshots","detail":"ALL-OR-NOTHING per league-week with completeness-based skip (fixed in 2caf9f8). A partial price fetch writes nothing rather than a half-week.","files":["supabase/functions/snapshot-week-start/index.ts:590"]},{"n":5,"edge":"e.fn.snapshot-week-start->pg.schedule_snapshot_retry","detail":"Retry scheduling, shared with snapshot-week-end.","files":["supabase/functions/snapshot-week-start/index.ts:143"]}],"annotation":null,"unverified":[]},{"id":"flow.week-end-snapshot","title":"Week-end snapshot","trigger":{"kind":"cron","detail":"pg_cron `snapshot-week-end` — Friday 21:05 UTC, 10 min before scoring","cronJob":"snapshot-week-end"},"nodePath":["cron.snapshot-week-end","fn.snapshot-week-end","ext.alpaca-data","mod.snapshot-week-end/close","tbl.week_snapshots","pg.schedule_snapshot_retry"],"steps":[{"n":1,"edge":"e.cron.snapshot-week-end->fn.snapshot-week-end","detail":"net.http_post with apikey from vault `cron_apikey`. Runs 10 minutes before process-weekly-matchups — that gap is the entire budget for writing week_end_price before scoring reads it.","files":["supabase/migrations/20261108000000_cron_explicit_timeouts.sql:133"]},{"n":2,"edge":"e.fn.snapshot-week-end->ext.alpaca-data","detail":"Friday close prices.","files":["supabase/functions/snapshot-week-end/index.ts:46"]},{"n":3,"edge":"e.fn.snapshot-week-end->mod.snapshot-week-end/close","detail":"Pure coverage gate (hermetic tests in close.test.ts). Per-participant completeness replaced the old existence-only alreadyProcessed skip, so a partial week-end write is healed on retry instead of read as done. Deliberately NOT symmetrical with week-start/plan.ts: week-end has two write paths (close an existing Monday row; insert a mid-week buy), so \"missing\" has two kinds.","files":["supabase/functions/snapshot-week-end/index.ts:3","supabase/functions/snapshot-week-end/close.ts:128"]},{"n":4,"edge":"e.fn.snapshot-week-end->tbl.week_snapshots#update","detail":"Writes week_end_price onto existing Monday rows.","files":["supabase/functions/snapshot-week-end/index.ts:674"]},{"n":5,"edge":"e.fn.snapshot-week-end->tbl.week_snapshots#upsert","detail":"Mid-week purchases: positions with no week-start row get one here, carrying a real weighted-average entry price and entered_mid_week = true, upserted on the (league, user, week, symbol) key. This insert had NEVER succeeded before 2026-07-27 — it wrote week_start_price: null against a NOT NULL column, so every mid-week position was silently dropped from scoring. The flag is what stops the row being double-counted as a Monday holding.","files":["supabase/functions/snapshot-week-end/close.ts:104","supabase/functions/snapshot-week-end/close.ts:162","supabase/functions/snapshot-week-end/index.ts:689"]},{"n":6,"edge":"e.fn.snapshot-week-end->pg.schedule_snapshot_retry","detail":"Shared retry path.","files":["supabase/functions/snapshot-week-end/index.ts:126"]}],"annotation":"Read this against flow.week-start-snapshot. The asymmetry USED to be that week-end had no extracted module, no tests and an unaudited write path; that was closed on 2026-07-28 (see fn.snapshot-week-end). Both now have a pure decision module with hermetic tests, a completeness-based coverage gate that runs before any Alpaca call, and all-or-nothing per-league writes.\n\nThe REMAINING asymmetry is intrinsic and load-bearing, not debt: week-start inserts one row per holding, while week-end must both CLOSE existing Monday rows and INSERT mid-week buys. That is why close.ts models two kinds of 'missing' where plan.ts models one. Do not refactor them into a shared module on the assumption they are the same shape — they are not.\n\nTiming still matters: week-end runs only ten minutes before scoring, so an aborted league has little room to be healed by a retry before process-week-results reads the same rows. The downstream per-user gate (decideUserScorer -> 'unscoreable') remains the required backstop.","unverified":[]},{"id":"flow.place-trade","title":"Buy or sell a stock","trigger":{"kind":"user","detail":"User confirms a buy or sell in the stock sheet's review (post-draft add/drop; the legacy TradeModal was deleted in W4 Portfolio)"},"nodePath":["ui.money.useStockSheetData","fn.ticker-quotes","ui.money.recordTrade","fn.record-trade","pg.check_and_bump_rate_limit","tbl.leagues","tbl.symbols","tbl.trades"],"steps":[{"n":1,"edge":"e.ui.money.useStockSheetData->fn.ticker-quotes","detail":"Live quote for display before confirming. Advisory only — the fill price is re-derived server-side.","files":["apps/mobile/lib/money/useStockSheetData.ts:139"]},{"n":2,"edge":"e.ui.money.recordTrade->fn.record-trade","detail":"The ONLY trade write path since DR-001 Phase 3: the client-INSERT policy on trades was dropped (20260811000002). verify_jwt=true + in-code getUser(). The same function answers the review's advisory preview (slot map, would_fill — which ignores the budget, so the client refuses an over-budget buy itself).","files":["apps/mobile/lib/money/recordTrade.ts:33"]},{"n":3,"edge":"e.fn.record-trade->pg.check_and_bump_rate_limit","detail":"Per-user and per-IP buckets.","files":["supabase/functions/record-trade/index.ts:164"]},{"n":4,"edge":"e.fn.record-trade->tbl.leagues","detail":"League rules: stake mode, budget, notional, allow_undraftable.","files":["supabase/functions/record-trade/commit.ts:217"]},{"n":5,"edge":"e.fn.record-trade->tbl.symbols","detail":"is_draftable gate for buys (bypassed only when the commissioner set allow_undraftable).","files":["supabase/functions/record-trade/index.ts:420"]},{"n":6,"edge":"e.fn.record-trade->tbl.trades","detail":"Validated by the shared pure module (_shared/draft-validation.ts), filled at the server-fetched price. KNOWN RACE: two concurrent buys can both pass validation — needs an atomic SECURITY DEFINER RPC.","files":["supabase/functions/record-trade/commit.ts:240"]}],"annotation":"Since DR-001 Phase 3 the trade row is written SERVER-SIDE by record-trade, in the same request that validates it; the client-INSERT policy on trades is gone (20260811000002). The old two-actor gap (a real broker order with no DB row, closed after the fact by sync-alpaca-orders) no longer exists — there is no broker order at all, and place-order / sync-alpaca-orders / broker_credentials are deleted. What remains open is the concurrent-buy race inside record-trade (see the step note).\n\nPARTIAL SALES READ AS A BUG BUT ARE NOT ONE. If a position is partly sold during the week, the matchup and dashboard screens show UNREALIZED P/L on the quantity still held at week end, while the scorer additionally settles the REALIZED P/L of the sold portion from midWeekTrades. So a screen and a standings number can legitimately differ after a partial sale, and the screen will read low. This is pre-existing and symmetrical: week-start holdings behave the same way, because their snapshot quantity is Monday's and the UI never consults trades. Not a defect — but it is the first thing a user will report, so recognise it rather than re-investigating.","unverified":[]},{"id":"flow.draft-stock","title":"Draft a stock","trigger":{"kind":"user","detail":"User makes a pick on the draft screen"},"nodePath":["fn.validate-and-record-pick","tbl.drafts"],"steps":[{"n":1,"edge":"e.ui.draft->fn.quote","detail":"Price display for candidate picks. Advisory only.","files":[],"verified":false},{"n":2,"edge":"e.ui.draft->fn.validate-and-record-pick","detail":"The ONLY pick write path since DR-001 Phase 3: the client-INSERT policies on drafts were dropped (20260811000003).","files":[],"verified":false},{"n":3,"edge":"e.fn.validate-and-record-pick->tbl.leagues","detail":"League rules: draft status, rounds, stake mode, budget, allow_undraftable.","files":[],"verified":false},{"n":4,"edge":"e.fn.validate-and-record-pick->tbl.drafts#insert","detail":"Legality (turn, uniqueness, draftable universe, slot category/price bracket, stake budget) decided by the shared pure module; a 23505 on pick_number is a lost race and the client refetches.","files":["supabase/functions/validate-and-record-pick/index.ts:320"]},{"n":5,"edge":"e.fn.validate-and-record-pick->tbl.leagues#update","detail":"On the final pick, markDraftComplete sets draft_status=completed — and NOTHING ELSE. No matchups, no initial standings, no league start/end dates: those are generated only by the paused web client, so a league drafted on mob <script>
(function () {
  const D = JSON.parse(document.getElementById('arch-data').textContent);
  const byId = new Map(D.nodes.map(n => [n.id, n]));
  const edgeById = new Map(D.edges.map(e => [e.id, e]));
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------- provenance ----------
  el('m-commit').textContent = D.generated.commitShort + ' (' + D.generated.branch + ')';
  el('m-gen').textContent = D.generated.timestamp.replace('T', ' ').replace('Z', ' UTC');
  el('m-hash').textContent = D.generated.sourceHash.replace('sha256:', '').slice(0, 12);
  // The dirty badge names the files, because "dirty tree" alone tells you nothing you
  // can act on. It counts only sources this map is derived from (plus the generator) —
  // never the generated output, which is dirty by definition on every regeneration.
  const dirty = el('m-dirty');
  const dp = D.generated.dirtyPaths || [];
  if (dp.length) {
    dirty.textContent = dp.length + ' source' + (dp.length > 1 ? 's' : '') + ' uncommitted at build';
    dirty.className = 'pill med btn';
    dirty.title = 'Click for the list';
    dirty.addEventListener('click', () => openDrawer(
      'Uncommitted at build time',
      'commit <code>' + esc(D.generated.commitShort) + '</code> does not fully describe this map',
      '<p class="lede">These files the map reads had uncommitted changes when it was generated, so the commit above does not identify everything you are looking at. If they were committed afterwards, regenerate to clear this.</p>' +
      '<ul>' + dp.map(f => '<li style="margin:5px 0"><code>' + esc(f.path) + '</code> <span class="proto">' + esc(f.code || '?') + '</span></li>').join('') + '</ul>' +
      '<h3>Why the commit is the parent</h3><p class="lede">' + esc(D.generated.commitMeaning || '') + '</p>'));
  } else dirty.remove();

  const db = D.dbSnapshot, dbPill = el('m-db');
  if (!db.present) { dbPill.textContent = 'NO DB SNAPSHOT'; dbPill.className = 'pill high'; }
  else {
    const d = db.ageDays;
    dbPill.textContent = 'db snapshot ' + (d < 1 ? Math.max(1, Math.round(db.ageHours)) + 'h old' : d + 'd old');
    dbPill.className = 'pill ' + (db.stale ? 'high' : d > db.staleAfterDays / 2 ? 'med' : 'ok');
    dbPill.title = 'Captured ' + db.capturedAt + ' · stale after ' + db.staleAfterDays + ' days';
  }

  // ---------- loud banners (collapsible so they never bury the graph) ----------
  const high = D.drift.filter(r => r.severity === 'high');
  const banners = [];
  if (!db.present) banners.push({ cls: 'stale', open: true,
    h: 'This map does not know anything about the database.',
    body: '<p>No <code>docs/architecture/db-snapshot.json</code>. Every function ACL, search_path pin, RLS policy and cron job below is <b>unknown</b> — not verified-absent. Run <code>docs/architecture/db-snapshot.sql</code> against prod and save the output.</p>' });
  else if (db.stale) banners.push({ cls: 'stale', open: true,
    h: 'Database snapshot is ' + db.ageDays + ' days old.',
    body: '<p>Past the ' + db.staleAfterDays + '-day limit. Grants, policies and cron schedules below may no longer match prod.</p>' });

  if (high.length) banners.push({ cls: 'stale', open: true,
    h: high.length + ' high-severity claim-vs-reality mismatch' + (high.length > 1 ? 'es' : ''),
    body: '<ul>' + high.map(r => '<li><b>' + esc(r.label) + '</b> — ' + esc(r.note) +
      '<div class="why">migration says: <code>' + esc(r.declared) + '</code><br>database says: <code>' + esc(r.live) + '</code></div></li>').join('') + '</ul>' });

  if (D.unverified.length) banners.push({ cls: 'warn', open: false,
    h: D.unverified.length + ' thing' + (D.unverified.length > 1 ? 's' : '') + ' this map could NOT verify',
    body: '<ul>' + D.unverified.map(u => '<li><b>' + esc(u.scope) + '</b> — ' + esc(u.claim) +
      '<div class="why">' + esc(u.reason) + '<br>resolve: <code>' + esc(u.resolve) + '</code></div></li>').join('') + '</ul>' });

  el('banners').innerHTML = banners.map(b =>
    '<div class="banner ' + b.cls + '"><details' + (b.open ? ' open' : '') +
    '><summary><h2>' + esc(b.h) + '</h2></summary>' + b.body + '</details></div>').join('');

  // ---------- columns ----------
  const driftByNode = new Map();
  for (const r of D.drift) { if (!driftByNode.has(r.node)) driftByNode.set(r.node, []); driftByNode.get(r.node).push(r); }

  el('columns').innerHTML = D.layers.map(L => {
    const ns = D.nodes.filter(n => n.layer === L.id);
    return '<div class="col" data-layer="' + L.id + '"><h3>' + esc(L.label) + ' · ' + ns.length + '</h3>' +
      ns.map(n => {
        const dr = driftByNode.get(n.id) || [];
        const worst = dr.some(d => d.severity === 'high') ? 'high' : dr.some(d => d.severity === 'medium') ? 'med' : dr.length ? 'low' : null;
        const flags = [];
        if (worst) flags.push('<span class="flag ' + worst + '">drift ' + dr.length + '</span>');
        if (!n.verified) flags.push('<span class="flag unv">unverified</span>');
        if (n.annotation) flags.push('<span class="flag note">note</span>');
        return '<div class="node" data-layer="' + L.id + '" data-id="' + esc(n.id) + '">' +
          '<div class="lbl">' + esc(n.label) + '</div>' +
          (n.sublabel ? '<div class="sub">' + esc(n.sublabel) + '</div>' : '') +
          (flags.length ? '<div class="flags">' + flags.join('') + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  }).join('');

  // ---------- state ----------
  let currentFlow = null, hideOff = false, activeStep = null;
  const nodeEl = (id) => document.querySelector('.node[data-id="' + CSS.escape(id) + '"]');

  function edgesOfStep(s) { return (Array.isArray(s.edge) ? s.edge : [s.edge]).map(id => edgeById.get(id)).filter(Boolean); }

  function drawWires() {
    const svg = el('wires');
    svg.innerHTML = '';
    if (!currentFlow) return;
    const wrap = el('graphwrap');
    const wr = wrap.getBoundingClientRect();
    const ox = wr.left - wrap.scrollLeft;
    const oy = wr.top - wrap.scrollTop;
    const NS = 'http://www.w3.org/2000/svg';
    for (const step of currentFlow.steps) {
      const focused = activeStep === null || activeStep === step.n;
      for (const e of edgesOfStep(step)) {
        const a = nodeEl(e.from), b = nodeEl(e.to);
        if (!a || !b || a.classList.contains('hidden') || b.classList.contains('hidden')) continue;
        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        const x1 = ra.right - ox, y1 = ra.top + ra.height / 2 - oy;
        const x2 = rb.left - ox,  y2 = rb.top + rb.height / 2 - oy;
        const mx = (x1 + x2) / 2;
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
        p.setAttribute('opacity', focused ? '.85' : '.12');
        svg.appendChild(p);
        if (!focused) continue;
        // Stagger badges along the curve: one source often fans out to many targets,
        // so every curve shares a midpoint x and the numbers would stack into a pile.
        const t = 0.34 + ((step.n - 1) % 5) * 0.11, u = 1 - t;
        const bez = (P0, P1, P2, P3) => u*u*u*P0 + 3*u*u*t*P1 + 3*u*t*t*P2 + t*t*t*P3;
        const bx = bez(x1, mx, mx, x2), by = bez(y1, y1, y2, y2);
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', 9);
        svg.appendChild(c);
        const tx = document.createElementNS(NS, 'text');
        tx.setAttribute('x', bx); tx.setAttribute('y', by + 3.5); tx.textContent = step.n;
        svg.appendChild(tx);
      }
    }
  }

  function paintNodes() {
    const inPath = new Set(currentFlow ? currentFlow.nodePath : []);
    const stepOf = new Map();
    if (currentFlow) for (const s of currentFlow.steps) for (const e of edgesOfStep(s)) if (!stepOf.has(e.to)) stepOf.set(e.to, s.n);
    document.querySelectorAll('.node').forEach(nd => {
      const on = currentFlow && inPath.has(nd.dataset.id);
      nd.classList.toggle('on', !!on);
      nd.classList.toggle('dim', !!currentFlow && !on && !hideOff);
      nd.classList.toggle('hidden', !!currentFlow && !on && hideOff);
      const sn = on ? stepOf.get(nd.dataset.id) : null;
      nd.classList.toggle('step', sn != null);
      if (sn != null) nd.dataset.step = sn; else delete nd.dataset.step;
    });
  }

  function renderRail() {
    const head = el('railhead'), body = el('railbody');
    if (!currentFlow) {
      head.innerHTML = '<h3>Flows</h3>';
      body.innerHTML = D.flows.map(f =>
        '<div class="flow" data-id="' + esc(f.id) + '"><div class="t">' + esc(f.title) + '</div>' +
        '<div class="tr">' + esc(f.trigger.kind) + ' · ' + f.steps.length + ' steps</div></div>').join('');
      return;
    }
    head.innerHTML = '<button class="back" id="backbtn">&larr; All flows</button>' +
      '<div class="ftitle">' + esc(currentFlow.title) + '</div>' +
      '<div class="ftrig">' + esc(currentFlow.trigger.detail) + '</div>';
    body.innerHTML = (currentFlow.annotation ? '<div class="anno">' + esc(currentFlow.annotation) + '</div>' : '') +
      '<ol class="steps">' + currentFlow.steps.map(s => {
        const e = edgesOfStep(s)[0];
        const path = e ? (byId.get(e.from)?.label || e.from) + ' → ' + (byId.get(e.to)?.label || e.to) : String(s.edge);
        return '<li data-step="' + s.n + '"' + (activeStep === s.n ? ' class="on"' : '') + '>' +
          '<div class="num">' + s.n + '</div><div class="stepbody">' +
          '<div class="path">' + esc(path) + (e ? '<span class="proto">' + esc(e.protocol) + '</span>' : '') + '</div>' +
          '<div class="det">' + esc(s.detail) + '</div>' +
          (e && e.annotation ? '<div class="anno" style="margin:7px 0 0">' + esc(e.annotation) + '</div>' : '') +
          (s.files && s.files.length ? '<div class="cites">' + s.files.map(f => '<span class="cite">' + esc(f) + '</span>').join('') + '</div>' : '') +
          '</div></li>';
      }).join('') + '</ol>';
  }

  function selectFlow(flow) {
    currentFlow = flow; activeStep = null;
    renderRail(); paintNodes();
    requestAnimationFrame(drawWires);
  }

  // ---------- rail interactions (no viewport movement anywhere) ----------
  el('railbody').addEventListener('click', ev => {
    const f = ev.target.closest('.flow');
    if (f) { selectFlow(D.flows.find(x => x.id === f.dataset.id)); return; }
    const li = ev.target.closest('li[data-step]');
    if (li) {
      const n = +li.dataset.step;
      activeStep = activeStep === n ? null : n;
      renderRail(); drawWires();
    }
  });
  el('railhead').addEventListener('click', ev => { if (ev.target.id === 'backbtn') selectFlow(null); });
  el('clearflow').addEventListener('click', () => selectFlow(null));
  el('hidetoggle').addEventListener('click', ev => {
    hideOff = !hideOff;
    ev.target.textContent = hideOff ? 'Show all' : 'Hide off-path';
    paintNodes(); requestAnimationFrame(drawWires);
  });

  // ---------- drawer ----------
  function openDrawer(title, sub, html) {
    el('d-title').textContent = title;
    el('d-sub').innerHTML = sub;
    el('d-body').innerHTML = html;
    el('drawer').classList.add('open');
    el('scrim').classList.add('open');
  }
  function closeDrawer() { el('drawer').classList.remove('open'); el('scrim').classList.remove('open'); }
  el('d-close').addEventListener('click', closeDrawer);
  el('scrim').addEventListener('click', closeDrawer);
  addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDrawer(); });

  const driftCard = (r, withObj) =>
    '<div class="dcard ' + r.severity + '">' + (withObj ? '<div class="obj">' + esc(r.label) + ' · ' + esc(r.field) + '</div>' : '') +
    '<span class="says"><b>migration says:</b> ' + esc(r.declared) + '</span>' +
    '<span class="says"><b>database says:</b> ' + esc(r.live) + '</span>' +
    '<div class="why">' + esc(r.note) + '</div></div>';

  // Findings that repeat across many objects collapse into ONE row with the affected
  // list behind a disclosure. A panel where 11 of 15 rows restate one observation
  // teaches the reader to skip it, which costs more than the detail is worth.
  el('driftbtn').addEventListener('click', () => {
    const groups = new Map();
    for (const r of D.drift) {
      const k = r.groupKey || r.field;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    const sev = { high: 0, medium: 1, low: 2 };
    const ordered = [...groups.values()].sort((a, b) => sev[a[0].severity] - sev[b[0].severity] || b.length - a.length);
    const html = ordered.map(rows => rows.length === 1 ? driftCard(rows[0], true) :
      '<div class="dcard ' + rows[0].severity + '">' +
      '<div class="obj">' + esc(rows[0].field) + ' — ' + rows.length + ' objects</div>' +
      '<div class="why">' + esc(rows[0].note) + '</div>' +
      '<details style="margin-top:8px"><summary>' + rows.map(r => esc(r.label)).join(', ') + '</summary>' +
      rows.map(r => '<div style="margin:8px 0 0"><span class="says"><b>' + esc(r.label) + ':</b> ' + esc(r.live) + '</span></div>').join('') +
      '</details></div>').join('');
    openDrawer('Claim vs reality',
      D.drift.length + ' findings in ' + ordered.length + ' groups · ' + high.length + ' high severity',
      '<p class="lede">Every place the repo\'s migrations disagree with what prod actually has. Migration text is a claim; <code>db-snapshot.json</code> is the evidence. <code>REVOKE … FROM PUBLIC</code> does not clear Supabase\'s default <code>anon</code>/<code>authenticated</code> grants, and <code>CREATE OR REPLACE FUNCTION</code> does not reset privileges — so "the migration says it is locked down" is never evidence that it is.</p>' + html);
  });

  el('deadbtn').addEventListener('click', () => {
    const dc = D.deadCode || [];
    openDrawer('Nothing calls these', dc.length + ' nodes with zero inbound edges',
      '<p class="lede">Reachable by nothing in the scanned surface. Triggers, client screens and external services are excluded — those are entry points, so an inbound count says nothing about them. Treat this as a cleanup worklist, not a proof: a dynamically-built invoke or dynamic SQL would not be seen.</p>' +
      (dc.length ? dc.map(n => '<div class="dcard low"><div class="obj">' + esc(n.label) + ' <span class="proto">' + esc(n.kind) + '</span></div>' +
        (n.source ? '<span class="says">' + esc(n.source) + '</span>' : '') +
        (n.outbound.length ? '<div class="why">still reaches: ' + n.outbound.map(o => '<code>' + esc(o) + '</code>').join(', ') + '</div>' : '') +
        '<div class="why">' + esc(n.caveat) + '</div></div>').join('') : '<p>Nothing unreachable.</p>'));
  });

  el('columns').addEventListener('click', ev => {
    const nd = ev.target.closest('.node'); if (!nd) return;
    const n = byId.get(nd.dataset.id); if (!n) return;
    const parts = [];
    if (n.annotation) parts.push('<div class="anno">' + esc(n.annotation) + '</div>');
    const dr = driftByNode.get(n.id) || [];
    if (dr.length) parts.push('<h3>Claim vs reality</h3>' + dr.map(r => driftCard(r, false)).join(''));
    const pre = (t, o) => '<h3>' + t + '</h3><pre class="mono">' + esc(JSON.stringify(o, null, 2)) + '</pre>';
    if (n.db) parts.push(pre('Live database facts', n.db));
    if (n.declared) parts.push(pre('Declared by migrations', n.declared));
    if (n.facts && Object.keys(n.facts).length) parts.push(pre('Derived from files', n.facts));
    // Columns are shown inline: on a table like broker_credentials the difference
    // between select('key_id') and select('*') is the entire security question.
    const list = (es, dir) => es.length ? '<h3>' + dir + ' (' + es.length + ')</h3><ul>' + es.map(e =>
      '<li style="margin:5px 0"><code>' + esc(dir === 'Inbound' ? e.from : e.to) + '</code><span class="proto">' + esc(e.protocol) + '</span>' +
      (e.derivedFrom === 'sql-body' ? '<span class="proto">from SQL body</span>' : '') +
      (e.columns && e.columns.length
        ? '<div class="why" style="font-size:11.5px">columns: ' + e.columns.map(c =>
            '<code' + (c === '*' ? ' style="color:var(--high);font-weight:700"' : '') + '>' + esc(c) + '</code>').join(' · ') + '</div>'
        : '') +
      '<div class="cites">' + e.callSites.map(c => '<span class="cite">' + esc(c) + '</span>').join('') + '</div></li>').join('') + '</ul>' : '';
    parts.push(list(D.edges.filter(e => e.to === n.id), 'Inbound'));
    parts.push(list(D.edges.filter(e => e.from === n.id), 'Outbound'));
    openDrawer(n.label, '<code>' + esc(n.id) + '</code> · ' + esc(n.kind) +
      (n.source ? ' · <code>' + esc(n.source.path) + ':' + n.source.line + '</code>' : ''), parts.join(''));
  });

  // ---------- theme ----------
  el('themebtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    requestAnimationFrame(drawWires);
  });

  addEventListener('resize', drawWires);
  el('graphwrap').addEventListener('scroll', drawWires);
  el('banners').addEventListener('toggle', () => requestAnimationFrame(drawWires), true);

  renderRail();
})();
</script>
</body>
</html>
